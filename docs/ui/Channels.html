<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert channels</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#F4F4F1}
a{color:#1D4ED8}a:hover{color:#1E3A8A}
</style>
</helmet>
<div style="min-height: 100vh; background: #F4F4F1; color: #17171A; font-family: 'Geist', system-ui, sans-serif; font-size: 15px; line-height: 1.5">
  <header style="background: #17171A; color: #FFFFFF">
    <div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
      <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; color: #FFFFFF; text-decoration: none">
        <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="6" fill="#2F2F35"></rect><path d="M3 14h5l2.5-6 4 11 2.5-5H23" stroke="#4ADE80" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        <span style="font-weight: 700; font-size: 17px; letter-spacing: -0.01em">CronPulse</span>
      </a>
      <nav style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
        <a href="Main.dc.html" style="padding: 10px 14px; border-radius: 6px; color: #C8C8CE; text-decoration: none">Checks</a>
        <a href="Channels.dc.html" style="padding: 10px 14px; border-radius: 6px; background: #2F2F35; color: #FFFFFF; text-decoration: none; font-weight: 500">Alert channels</a>
        <a href="https://codefarm.in" style="padding: 10px 14px; border-radius: 6px; color: #C8C8CE; text-decoration: none">Docs</a>
      </nav>
    </div>
  </header>

  <main style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.02em">Alert channels</h1>
      <span style="color: #5A5A63">Where CronPulse sends alerts when a check goes down or recovers.</span>
    </div>

    <div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{channels}}" as="c" hint-placeholder-count="3">
          <article style="background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 10px; padding: 20px 22px; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between">
            <div style="display: flex; gap: 14px; align-items: flex-start; min-width: 0; flex: 1 1 320px">
              <span style="width: 40px; height: 40px; border-radius: 8px; background: #F4F4F1; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: 'Geist Mono', monospace; font-size: 13px; font-weight: 500; color: #3A3A42" aria-hidden="true">{{c.mark}}</span>
              <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
                <strong style="font-weight: 600">{{c.name}} <span style="font-weight: 400; color: #5A5A63">· {{c.type}}</span></strong>
                <span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: #3A3A42; overflow-wrap: anywhere">{{c.target}}</span>
                <span style="font-size: 13px; color: #5A5A63">Used by {{c.used}}</span>
                <span style="{{c.statusStyle}}">{{c.status}}</span>
              </div>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px">
              <button style="font: inherit; font-size: 14px; font-weight: 500; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 1px solid #C9C9C2; background: #FFFFFF; color: #17171A; cursor: pointer">Send test</button>
              <button style="font: inherit; font-size: 14px; min-height: 44px; padding: 0 14px; border-radius: 8px; border: 0; background: transparent; color: #5A5A63; cursor: pointer">Edit</button>
            </div>
          </article>
        </sc-for>
      </section>

      <aside style="flex: 1 1 340px; max-width: 100%; background: #FFFFFF; border: 1px solid #E2E2DC; border-radius: 10px; padding: 24px; display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 600">Add a channel</h2>
        <div role="radiogroup" aria-label="Channel type" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{types}}" as="t" hint-placeholder-count="3">
            <button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ch-name" style="font-weight: 500">Name</label>
          <input id="ch-name" placeholder="e.g. On-call Slack" style="font: inherit; min-height: 44px; padding: 0 12px; border: 1px solid #C9C9C2; border-radius: 8px">
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <label for="ch-target" style="font-weight: 500">{{targetLabel}}</label>
          <input id="ch-target" placeholder="{{targetHint}}" style="font-family: 'Geist Mono', monospace; font-size: 14px; min-height: 44px; padding: 0 12px; border: 1px solid #C9C9C2; border-radius: 8px">
          <span style="font-size: 13px; color: #5A5A63">{{targetHelp}}</span>
        </div>
        <button style="font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: #1D4ED8; color: #FFFFFF; cursor: pointer">Add channel</button>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":940}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'Slack' };
  }
  renderVals() {
    const ok = 'font-size: 13px; color: #1F7A4D; font-weight: 500';
    const bad = 'font-size: 13px; color: #B42318; font-weight: 500';
    const info = {
      Email: ['Email address', 'you@company.com', 'We send a confirmation link before the first alert.'],
      Slack: ['Incoming webhook URL', 'https://hooks.slack.com/services/…', 'Create one in Slack: Apps › Incoming Webhooks.'],
      Webhook: ['Endpoint URL', 'https://example.com/hooks/cronpulse', 'We POST JSON with the check, status and last ping.']
    }[this.state.type];
    return {
      channels: [
        { mark: '@', name: 'My email', type: 'Email', target: 'arvind@example.com', used: '6 checks', status: 'Last delivery: today 02:15 · delivered', statusStyle: ok },
        { mark: '#', name: 'Ops alerts', type: 'Slack', target: 'hooks.slack.com/services/T0…/B0…', used: '4 checks', status: 'Last delivery: today 02:15 · delivered', statusStyle: ok },
        { mark: '{}', name: 'Incident bot', type: 'Webhook', target: 'https://ops.internal/hooks/cronpulse', used: '1 check', status: 'Last delivery: 9 Oct · failed after 5 retries (HTTP 502)', statusStyle: bad }
      ],
      types: ['Email', 'Slack', 'Webhook'].map((label) => {
        const on = this.state.type === label;
        return { label, on: on ? 'true' : 'false', pick: () => this.setState({ type: label }),
          style: 'font: inherit; font-size: 14px; min-height: 44px; border-radius: 8px; cursor: pointer; ' + (on ? 'border: 2px solid #1D4ED8; background: #E6EDFC; color: #1E3A8A; font-weight: 600' : 'border: 1px solid #C9C9C2; background: #FFFFFF; color: #17171A') };
      }),
      targetLabel: info[0],
      targetHint: info[1],
      targetHelp: info[2]
    };
  }
}
</script>
</body>
</html>
