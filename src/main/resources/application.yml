spring:
  application:
    name: cron-pulse
  threads:
    virtual:
      # Request handling and blocking I/O run on virtual threads (see CLAUDE.md §3).
      enabled: true
  datasource:
    # Defaults match compose.yaml. In containers and production these come from env vars
    # (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD); no real credentials live in the repo.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/cronpulse}
    username: ${SPRING_DATASOURCE_USERNAME:cronpulse}
    password: ${SPRING_DATASOURCE_PASSWORD:cronpulse}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Don't hold a DB connection open while rendering a response.
    open-in-view: false
  mvc:
    # Spring MVC's own errors (404, 405, 415…) use RFC 9457 problem+json, like ours.
    problemdetails:
      enabled: true
  docker:
    compose:
      # `./gradlew bootRun` starts Postgres and Mailpit; `stop` keeps their data between runs.
      lifecycle-management: start-and-stop
      stop:
        command: stop

server:
  # Finish in-flight requests before the process exits (rolling deploys, Phase 5).
  shutdown: graceful
  # Behind a load balancer, take the client IP from X-Forwarded-For, but only when the request came
  # from a trusted internal proxy (Tomcat's RemoteIpValve). Stored as the ping's source IP.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  # Only document the public API, not actuator or (later) UI pages.
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html

cronpulse:
  # The URL jobs use to reach CronPulse; ping URLs in API responses are built from it.
  public-base-url: ${CRONPULSE_PUBLIC_BASE_URL:http://localhost:8080}
  # Until login exists (Phase 4), every request acts for this organisation (created if missing).
  default-organization-slug: default
  ping:
    # A job stuck in a loop must not be able to flood the database (CLAUDE.md §5.2).
    rate-limit-per-second: 5
    lookup-cache-ttl: 5m
    lookup-cache-size: 100000
