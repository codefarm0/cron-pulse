# Local infrastructure for CronPulse.
#
#   ./gradlew bootRun             -> Spring Boot starts postgres + mailpit from this file automatically
#   docker compose --profile app up    -> runs the whole stack in containers, including the app
#
# Values come from .env (copy .env.example). The defaults below are for local development only.
name: cron-pulse

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cronpulse}
      POSTGRES_USER: ${POSTGRES_USER:-cronpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cronpulse}
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends. Web UI: http://localhost:8025 (used from Phase 3).
  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  app:
    profiles: ["app"]
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cronpulse}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-cronpulse}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-cronpulse}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
